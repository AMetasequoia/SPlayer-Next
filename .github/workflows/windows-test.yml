name: Windows x64 Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest
    env:
      HUSKY: "0"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: 检出所选分支
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: 准备 pnpm
        uses: pnpm/action-setup@v6

      - name: 准备 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: 移除国内依赖镜像配置
        shell: bash
        run: rm -f .npmrc

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 检查代码规范
        run: pnpm lint

      - name: 运行测试
        run: pnpm test

      - name: 生成开发测试版本号
        run: node scripts/gen-version.cjs dev

      - name: 构建 Windows x64
        env:
          UPDATE_CHANNEL: nightly
        run: pnpm build:win --x64 --publish never

      - name: 上传测试包
        uses: actions/upload-artifact@v7
        with:
          name: SPlayer-Next-windows-x64-test-${{ github.run_number }}-${{ github.run_attempt }}
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: 构建摘要
        shell: bash
        run: |
          {
            echo '## Windows x64 测试包'
            echo "提交：$(git rev-parse --short HEAD)"
            echo '- 从 Artifacts 下载解压，使用独立测试目录中的 portable.exe，保留 UserData'
            echo '- 暂勿运行 setup.exe 或执行更新；产物保留 7 天'
          } >> "$GITHUB_STEP_SUMMARY"
